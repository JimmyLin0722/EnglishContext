<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<!-- @@LICENSE@@ -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Master Track</title>
<style>/* @@STYLES@@ */</style>
</head>
<body data-entry="boot">
<!-- （v0.4，FE-32）data-entry：boot（啟動前）→ firstRun／main，由 main.js、router 設定；data-tab 由 router 設定（architecture.md §4.2、§7.9） -->
<!-- 應用殼（FE-02；architecture.md §4.2 掛載點、§9 RWD）。各頁內容由 views 於 mount 時以 core/dom.js 建立。 -->
<header class="app-header">
  <div class="app-header__inner">
    <h1 class="app-title">English Master Track</h1>
    <button type="button" id="nav-toggle" class="btn app-nav-toggle" aria-controls="app-nav" aria-expanded="false">選單</button>
  </div>
</header>
<div id="app-banner" class="app-banner"></div>
<nav id="app-nav" class="app-nav" aria-label="功能區">
  <!-- （v0.5，FE-38）只留 4 鈕，依 NAV_TAB_ORDER；（v0.4，FE-26）每個按鈕：內嵌 SVG 圖示（單一 path、不寫命名空間屬性）＋ 文字（TAB_LABELS）；≥ 641px 以 CSS 隱藏圖示 -->
  <button type="button" class="app-nav__btn" data-tab="dashboard"><svg class="app-nav__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M2 17a10 10 0 0 1 20 0h-2.5a7.5 7.5 0 0 0-15 0zm9.3-.7 5-6 1.4 1.4-5 6zM14 17a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM2 19h20v2H2z"/></svg><span class="app-nav__label">主控台</span></button>
  <button type="button" class="app-nav__btn" data-tab="customizer"><svg class="app-nav__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3zM7 4h3v6H7zm7 5h3v6h-3zm-5 5h3v6H9z"/></svg><span class="app-nav__label">難易度設定</span></button>
  <button type="button" class="app-nav__btn" data-tab="flashcards"><svg class="app-nav__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M6 3h13a2 2 0 0 1 2 2v11h-2V5H6zM3 7h13a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zm1 2v10h11V9zm2 3h7v1.5H6zm0 3h5v1.5H6z"/></svg><span class="app-nav__label">單字卡</span></button>
  <button type="button" class="app-nav__btn" data-tab="part5"><svg class="app-nav__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 6l1.4-1.4 1.6 1.6 3.1-3.1 1.4 1.4-4.5 4.5zm0 6l1.4-1.4 1.6 1.6 3.1-3.1 1.4 1.4-4.5 4.5zm0 6l1.4-1.4 1.6 1.6 3.1-3.1 1.4 1.4-4.5 4.5zM12 5h9v2h-9zm0 6h9v2h-9zm0 6h9v2h-9z"/></svg><span class="app-nav__label">模擬測驗</span></button>
</nav>
<main id="app-main" class="app-main">
  <section id="view-dashboard" class="view" aria-label="主控台" hidden></section>
  <section id="view-customizer" class="view" aria-label="難易度設定" hidden>
    <div id="customizer-goal"></div>
    <div id="customizer-custom"></div>
  </section>
  <section id="view-flashcards" class="view" aria-label="單字卡" hidden></section>
  <section id="view-part5" class="view" aria-label="模擬測驗" hidden></section>
  <!-- （v0.5，FE-38）隱藏頁 decoder、phrasebank 暫停開放（HT-4、HT-5）：section 保留為空且永遠 hidden、不設 aria-label，供未來開放時恢復 -->
  <section id="view-decoder" class="view" hidden></section>
  <section id="view-phrasebank" class="view" hidden></section>
  <section id="view-sources" class="view" aria-label="資料來源與授權" hidden></section>
</main>
<footer id="app-footer" class="app-footer">
  <button type="button" id="footer-sources" class="btn btn--link" data-go="sources">資料來源與授權</button>
  <!-- （v0.4，FE-32）首次模式且位於資料來源頁時才以 CSS 顯示（AC-25-07） -->
  <button type="button" id="footer-first-run-back" class="btn btn--link" data-go="customizer">返回難易度設定</button>
</footer>
<div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
<div id="dialog-root" class="dialog-root"></div>
<!-- @@DATA@@ -->
<!-- @@APP@@ -->
</body>
</html>
