# 部署 dist/english-master-track.html 到 GitHub Pages（發布為 index.html）
name: Deploy static content to Pages

on:
  # push 到 main 時自動部署
  push:
    branches: ["main"]

  # 可從 Actions 分頁手動執行
  workflow_dispatch:

# GITHUB_TOKEN 部署 GitHub Pages 所需權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；進行中的部署不取消
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir _site
          cp dist/english-master-track.html _site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 只上傳打包後的成品，不公開 docs/、src/
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
