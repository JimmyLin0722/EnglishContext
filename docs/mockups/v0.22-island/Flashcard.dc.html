<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>單字卡島嶼風</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#eaf7fb}
a{color:#2c6e8f}a:hover{color:#1d4f68}
button:focus-visible,a:focus-visible{outline:3px solid #2c6e8f;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #eaf7fb; font-family: 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif; color: #2f2a3d; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; background: #ffffff; border-bottom: 2.5px solid #3d3550">
    <a href="Main.dc.html" aria-label="回到群島" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; border: 2px solid #3d3550; color: #2f2a3d">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="flex: 1; min-width: 0">
      <p style="margin: 0; font-size: 12px; font-weight: 700; color: #5a5470">橘島・入門</p>
      <h1 style="margin: 0; font-size: 20px; font-weight: 900">單字卡</h1>
    </div>
    <span style="font-size: 13px; font-weight: 900; padding: 6px 10px; border-radius: 99px; background: #fff0e2; border: 2px solid #3d3550">今日 6 / 10</span>
  </header>

  <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px">

    <article aria-label="單字卡正面" style="position: relative; padding: 22px 18px 18px; background: #fffaf0; border: 2.5px solid #3d3550; border-radius: 24px; box-shadow: 0 5px 0 #3d3550; display: flex; flex-direction: column; gap: 8px">
      <svg width="60" height="34" viewBox="0 0 60 34" aria-hidden="true" style="position: absolute; top: -18px; right: 18px">
        <ellipse cx="30" cy="26" rx="27" ry="7" fill="#f7e2b0" stroke="#3d3550" stroke-width="2"></ellipse>
        <path d="M30 25 C29 18 28 12 31 6" fill="none" stroke="#3d3550" stroke-width="2.4" stroke-linecap="round"></path>
        <path d="M31 7 C25 3 19 5 16 10 C21 8 26 8 31 9 Z" fill="#7fd8a0" stroke="#3d3550" stroke-width="2" stroke-linejoin="round"></path>
        <path d="M31 7 C37 3 43 5 46 10 C41 8 36 8 31 9 Z" fill="#7fd8a0" stroke="#3d3550" stroke-width="2" stroke-linejoin="round"></path>
      </svg>
      <span style="align-self: flex-start; font-size: 12px; font-weight: 900; padding: 3px 10px; border-radius: 99px; background: #ffb26b; border: 2px solid #3d3550">橘級</span>
      <p lang="en" style="margin: 6px 0 0; font-size: 40px; font-weight: 900; letter-spacing: 0.5px">schedule</p>
      <p style="margin: 0; font-size: 15px; font-weight: 700; color: #5a5470">n. / v.</p>
      <div style="display: flex; gap: 8px; margin-top: 6px" role="group" aria-label="朗讀">
        <button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 14px; border: 2px solid #3d3550; background: #ffffff; font: inherit; font-weight: 900; font-size: 14px; display: flex; align-items: center; gap: 6px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg>
          1.0x
        </button>
        <button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 14px; border: 2px solid #3d3550; background: #ffffff; font: inherit; font-weight: 900; font-size: 14px">0.75x</button>
      </div>
    </article>

    <section aria-label="麥克風跟讀" style="padding: 14px; background: #ffffff; border: 2.5px solid #3d3550; border-radius: 20px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 10px">
        <button type="button" aria-pressed="true" style="min-height: 48px; padding: 0 16px; border-radius: 16px; border: 2.5px solid #3d3550; background: #ffe1e1; font: inherit; font-weight: 900; font-size: 15px; display: flex; align-items: center; gap: 8px">
          <span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #e5484d; border: 2px solid #3d3550"></span>
          聆聽中
        </button>
        <span role="img" aria-label="收音量" style="display: flex; gap: 4px; align-items: flex-end; height: 28px">
          <span style="width: 7px; height: 10px; border-radius: 4px; background: #4fb3cf; border: 1.5px solid #3d3550"></span>
          <span style="width: 7px; height: 15px; border-radius: 4px; background: #4fb3cf; border: 1.5px solid #3d3550"></span>
          <span style="width: 7px; height: 20px; border-radius: 4px; background: #4fb3cf; border: 1.5px solid #3d3550"></span>
          <span style="width: 7px; height: 24px; border-radius: 4px; background: #e7e3f0; border: 1.5px solid #3d3550"></span>
          <span style="width: 7px; height: 28px; border-radius: 4px; background: #e7e3f0; border: 1.5px solid #3d3550"></span>
        </span>
      </div>
      <p style="margin: 0; padding: 8px 12px; border-radius: 12px; background: #f1fbfd; border: 2px dashed #7fc4d6; font-size: 15px; color: #4a5568">聽到：<span lang="en" style="font-style: italic; font-weight: 700">sched</span></p>
    </section>

    <div role="status" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #e9fbef; border: 2.5px solid #3d3550; border-radius: 18px">
      <svg width="40" height="40" viewBox="0 0 20 20" aria-hidden="true">
        <ellipse cx="10" cy="17" rx="8" ry="2.4" fill="#f7e2b0" stroke="#3d3550" stroke-width="1.2"></ellipse>
        <path d="M10 17 L10 10" stroke="#3d3550" stroke-width="1.6" stroke-linecap="round"></path>
        <path d="M10 11 C6 11 3 8 3 4 C7 4 10 7 10 11 Z" fill="#8fe3b0" stroke="#3d3550" stroke-width="1.3" stroke-linejoin="round"></path>
        <path d="M10 11 C14 11 17 8 17 5 C13 5 10 7 10 11 Z" fill="#6fcf97" stroke="#3d3550" stroke-width="1.3" stroke-linejoin="round"></path>
      </svg>
      <div>
        <p style="margin: 0; font-size: 15px; font-weight: 900">上一張 92 分・綠燈</p>
        <p style="margin: 2px 0 0; font-size: 13px; font-weight: 700; color: #3f6b4f">橘島又長出一株新芽</p>
      </div>
    </div>

    <div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="min-height: 52px; border-radius: 16px; border: 2.5px solid #3d3550; background: #ffffff; font: inherit; font-weight: 900; font-size: 15px">上一張</button>
      <button type="button" style="min-height: 52px; border-radius: 16px; border: 2.5px solid #3d3550; background: #ff9f68; box-shadow: 0 4px 0 #3d3550; font: inherit; font-weight: 900; font-size: 15px">翻面</button>
      <button type="button" style="min-height: 52px; border-radius: 16px; border: 2.5px solid #3d3550; background: #ffffff; font: inherit; font-weight: 900; font-size: 15px">下一張</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
